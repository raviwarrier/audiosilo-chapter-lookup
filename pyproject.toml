[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosilo-chapter-lookup-sidecar"
version = "0.9.0"
description = "Independent Python sidecar that finds and adds chapters to AudioSilo books without transcription."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AudioSilo Chapter Sidecar" }]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "mutagen>=1.47.0",
]

[project.scripts]
chapter_sidecar = "chapter_sidecar.cli:main"

[tool.setuptools.packages.find]
include = ["chapter_sidecar*", "tests*"]